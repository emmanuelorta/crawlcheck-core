name: test
# Runs on pushes to main and on every pull request. Not on pushes to
# other branches: multi-directory changes land through the web upload form
# one directory per commit, so an intermediate commit on a working branch is
# expected to be red and must not page anyone. The PR run tests the head.
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    # The README promises Node 20+ and a clone anyone can test. Prove it on the
    # declared minimum, the current LTS and the newest release, on all three OSes.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24, 26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { check-latest: true, node-version: "${{ matrix.node }}" }
      - run: npm test
