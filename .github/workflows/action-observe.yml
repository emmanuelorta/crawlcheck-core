name: action self-test
# Runs the Action's observe and staple steps against crawlcheck.io exactly as a customer's workflow runs them: the
# observer from this repository's own runner (observer id gha:emmanuelorta/crawlcheck-core), the staple into a
# throwaway build folder, then checked offline the way an agent checks it.
on:
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./action
        with:
          domain: crawlcheck.io
          fix: "false"
          observe: "true"
  staple:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: A build folder with an existing _headers rule
        run: |
          mkdir -p dist
          printf '/assets/*\n  Cache-Control: max-age=31536000\n' > dist/_headers
      - uses: ./action
        with:
          domain: crawlcheck.io
          fix: "false"
          staple-dir: dist
          staple-headers-file: dist/_headers
      - name: Check the staple as an agent would
        run: |
          test -s dist/.well-known/crawlcheck-staple.json
          grep -q '^  CrawlCheck-Staple: v=ccr1;d=crawlcheck.io;' dist/_headers
          grep -q '/assets/\*' dist/_headers
          node --input-type=module -e "import { checkRecord } from './action/staple.mjs'; import fs from 'node:fs'; const d = JSON.parse(fs.readFileSync('dist/.well-known/crawlcheck-staple.json','utf8')); const k = (await (await fetch('https://crawlcheck.io/.well-known/http-message-signatures-directory')).json()).keys.map(x => x.kid); const c = checkRecord(d.record, 'crawlcheck.io', k); console.log(c.ok ? 'staple verifies' : c.why); process.exit(c.ok ? 0 : 1);"
