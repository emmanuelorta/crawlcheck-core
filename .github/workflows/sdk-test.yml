name: sdk-test
# The two SDK directories are the public source of @crawlcheck/sdk (npm) and crawlcheck (PyPI). Their suites run against
# production, so a red run here means the published package is broken against the live service, not only the copy.
on:
  push:
    branches: [main]
    paths: ['sdk/**', 'sdk-python/**']
  pull_request:
    paths: ['sdk/**', 'sdk-python/**']
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: "22" }
      - run: npm test
        working-directory: sdk
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests
        working-directory: sdk-python
