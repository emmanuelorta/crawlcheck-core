name: sdk-test
# The two SDK directories are the public source of @crawlcheck/sdk (npm) and crawlcheck (PyPI). Their suites run against
# production, so a red run here means the published package is broken against the live service, not only the copy.
on:
  push:
    branches: [main]
    paths: ['sdk/**', 'sdk-python/**']
  pull_request:
    paths: ['sdk/**', 'sdk-python/**']
jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with: { check-latest: true, node-version: "22" }
      - run: npm test
        working-directory: sdk
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: { python-version: "3.12" }
      - run: python -m unittest discover -s tests
        working-directory: sdk-python
