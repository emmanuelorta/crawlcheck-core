name: publish
# Publishes crawlcheck-core to npm on every version tag, with npm trusted
# publishing (OIDC): no npm token is stored anywhere. Provenance is attached
# automatically, so the registry page proves which commit built the tarball.
#
# One-time setup, after the first manual publish (npm requires the package to
# exist before a trusted publisher can be added):
#   npmjs.com -> crawlcheck-core -> Settings -> Trusted Publisher -> GitHub Actions
#   Organization or user: emmanuelorta   Repository: crawlcheck-core   Workflow: publish.yml
on:
  push:
    tags: ['v*']
permissions:
  id-token: write   # OIDC token exchange with the npm registry
  contents: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # npm >= 11.5.1 performs the OIDC exchange itself when it sees the Actions env.
      - run: npm install -g npm@latest
      - run: npm test
      # The tag must match package.json, or the registry would carry a version the repo never named.
      - run: |
          TAG="${GITHUB_REF_NAME#v}"; PKG="$(node -p "require('./package.json').version")"
          [ "$TAG" = "$PKG" ] || { echo "tag v$TAG != package.json $PKG"; exit 1; }
      - run: npm publish --access public
