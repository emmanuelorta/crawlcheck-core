[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "crawlcheck"
version = "1.5.1"
description = "CrawlCheck client: resolve a domain, get a signed decision for an agent action, verify CrawlCheck evidence offline. No dependencies."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "VSNARY" }]
urls = { Homepage = "https://crawlcheck.io/sdk", Documentation = "https://crawlcheck.io/docs/api", Source = "https://github.com/emmanuelorta/crawlcheck-core/tree/main/sdk-python", Issues = "https://github.com/emmanuelorta/crawlcheck-core/issues" }

[tool.setuptools]
packages = ["crawlcheck"]
