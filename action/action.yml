name: CrawlCheck fixes
description: Opens a pull request with a corrected robots.txt (and sitemap, for static sites) when CrawlCheck finds a defect in the live files. Optionally staples the signed CrawlCheck verdict into a static build and reads the site from this runner as a CrawlCheck observer.
author: CrawlCheck (crawlcheck.io)
branding:
  icon: check-circle
  color: yellow
inputs:
  domain:
    description: The site to check, e.g. example.com
    required: true
  robots-path:
    description: Path of robots.txt in this repository. Empty skips robots.txt.
    default: robots.txt
  sitemap-path:
    description: Path of a static sitemap.xml in this repository. Empty (the default) skips the sitemap; leave it empty when a CMS or plugin generates the sitemap.
    default: ""
  branch:
    description: Branch the fixes are pushed to.
    default: crawlcheck/fixes
  token:
    description: Token used to push and open the pull request. Needs contents and pull-requests write.
    default: ${{ github.token }}
  fix:
    description: '"false" skips the fix step (observe only).'
    default: "true"
  staple-dir:
    description: Build output folder of a static site (e.g. dist). When set, the site's signed CrawlCheck verdict is written to <staple-dir>/.well-known/crawlcheck-staple.json, verified first. Run it in the job that deploys, at least weekly (a staple lasts 7 days).
    default: ""
  staple-headers-file:
    description: A _headers file (Netlify, Cloudflare Pages) to add the CrawlCheck-Staple header to, e.g. dist/_headers. Only used with staple-dir.
    default: ""
  observe:
    description: '"true" also reads the site from this runner and posts a signed observation to CrawlCheck (id gha:<owner>/<repo>). Needs Node 20+ and permissions id-token write.'
    default: "false"
outputs:
  changed:
    description: "true when a fix was written and a pull request opened or updated"
    value: ${{ steps.run.outputs.changed }}
  pr-url:
    description: The pull request, when one was opened or updated
    value: ${{ steps.run.outputs.pr_url }}
runs:
  using: composite
  steps:
    - if: inputs.staple-dir != ''
      shell: bash
      env:
        CC_DOMAIN: ${{ inputs.domain }}
        CC_STAPLE_DIR: ${{ inputs.staple-dir }}
        CC_STAPLE_HEADERS: ${{ inputs.staple-headers-file }}
      run: node "$GITHUB_ACTION_PATH/staple.mjs"
    - if: inputs.observe == 'true'
      shell: bash
      env:
        CC_DOMAIN: ${{ inputs.domain }}
      run: node "$GITHUB_ACTION_PATH/observe.mjs"
    - id: run
      if: inputs.fix != 'false'
      shell: bash
      env:
        CC_DOMAIN: ${{ inputs.domain }}
        CC_ROBOTS: ${{ inputs.robots-path }}
        CC_SITEMAP: ${{ inputs.sitemap-path }}
        CC_BRANCH: ${{ inputs.branch }}
        GH_TOKEN: ${{ inputs.token }}
      run: bash "$GITHUB_ACTION_PATH/run.sh"
